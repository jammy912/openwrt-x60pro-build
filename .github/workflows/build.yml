name: Build OpenWrt for RG-X60 Pro (107M)

# 升級大版本時只要改這裡的 default（或在 Run workflow 時填入），其餘不用動：
#   v25.12.5 -> v26.1.0
# 上游若改動了我們依賴的 DTS / 檔案結構 / 套件名稱，patch-107m.sh 或 make-config.sh 會直接 fail。
on:
  workflow_dispatch:
    inputs:
      openwrt_tag:
        description: 'OpenWrt 官方 tag（例 v25.12.5）'
        required: true
        default: 'v25.12.5'
      skip_vermagic_check:
        description: '略過 vermagic 與官方一致的檢查（不建議；不一致時無法 apk add 官方 kmod）'
        type: boolean
        default: false

env:
  OPENWRT_TAG: ${{ inputs.openwrt_tag }}
  DEVICE: ruijie_rg-x60-pro-107m

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout 本 repo
        uses: actions/checkout@v4

      - name: 版本變數
        run: |
          VER="${OPENWRT_TAG#v}"
          echo "OPENWRT_VER=$VER" >> "$GITHUB_ENV"
          echo "OFFICIAL_BASE=https://downloads.openwrt.org/releases/$VER/targets/mediatek/filogic" >> "$GITHUB_ENV"

      - name: 釋放磁碟空間
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: 安裝編譯依賴
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget \
            u-boot-tools device-tree-compiler

      - name: Clone 官方 OpenWrt ${{ env.OPENWRT_TAG }}
        run: |
          git clone --depth 1 -b "$OPENWRT_TAG" https://github.com/openwrt/openwrt.git openwrt
          git -C openwrt log -1 --format='%H %s'
          # tag 版本的 feeds.conf.default 已把 feed 釘在官方發版的 commit，與官方 feeds.buildinfo 比對
          curl -fsSL "$OFFICIAL_BASE/feeds.buildinfo" -o official-feeds.buildinfo
          diff <(sort openwrt/feeds.conf.default | grep -v '^#') <(sort official-feeds.buildinfo) \
            && echo "feeds 與官方一致" || echo "::warning::feeds.conf.default 與官方 feeds.buildinfo 不同"

      - name: 更新 feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 套用 107M 修改（DTS / profile / board name）
        run: bash scripts/patch-107m.sh openwrt

      - name: 產生 .config（官方 buildinfo 為 seed + defconfig）
        run: bash scripts/make-config.sh openwrt "$OPENWRT_VER" config/packages.txt

      - name: 上傳 config 檢查檔
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-${{ env.OPENWRT_TAG }}
          path: |
            openwrt/seed.config
            openwrt/.config
            openwrt/defconfig.diff
            openwrt/official.buildinfo
          if-no-files-found: warn

      - name: 下載原始碼
        working-directory: openwrt
        run: make download -j8 || make download -j1 V=s

      - name: 編譯 tools + toolchain
        working-directory: openwrt
        run: make -j$(nproc) tools/install toolchain/install || make -j1 V=s tools/install toolchain/install

      - name: 編譯 kernel 並比對 vermagic
        working-directory: openwrt
        run: |
          make -j$(nproc) target/linux/compile || make -j1 V=s target/linux/compile
          GOT=$(cat build_dir/target-*/linux-mediatek_filogic/linux-*/.vermagic)
          EXP=$(curl -fsSL "$OFFICIAL_BASE/kmods/" | grep -oE 'href="[0-9][^"/]*-[0-9a-f]{32}/"' | head -n1 | grep -oE '[0-9a-f]{32}')
          echo "vermagic 本次: $GOT"
          echo "vermagic 官方: $EXP"
          if [ "$GOT" != "$EXP" ]; then
            if [ "${{ inputs.skip_vermagic_check }}" = "true" ]; then
              echo "::warning::vermagic 與官方不同，之後無法 apk add 官方 kmod"
            else
              echo "::error::vermagic 與官方不同（kernel config 和官方不一致），停止編譯"
              exit 1
            fi
          fi
          echo "$GOT" > vermagic.txt

      - name: 編譯 firmware
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log | tail -n 50 \
            || make -j1 V=s 2>&1 | tee build-verbose.log | tail -n 300

      - name: 驗證 image 分割表（刷機前檢查）
        run: |
          IMG=$(ls openwrt/bin/targets/mediatek/filogic/*-${DEVICE}-squashfs-sysupgrade.bin)
          bash scripts/verify-image.sh "$IMG" | tee verify-report.txt

      - name: 整理產出
        if: always()
        run: |
          mkdir -p out
          D=openwrt/bin/targets/mediatek/filogic
          cp $D/*-${DEVICE}-* out/ 2>/dev/null || true
          cp $D/sha256sums $D/config.buildinfo $D/feeds.buildinfo $D/version.buildinfo out/ 2>/dev/null || true
          cp $D/profiles.json out/ 2>/dev/null || true
          cp openwrt/vermagic.txt openwrt/defconfig.diff verify-report.txt out/ 2>/dev/null || true
          cp openwrt/build.log openwrt/build-verbose.log out/ 2>/dev/null || true
          ls -lh out/
          df -h /

      - name: 上傳 firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.OPENWRT_TAG }}-${{ env.DEVICE }}
          path: out/
          retention-days: 30
